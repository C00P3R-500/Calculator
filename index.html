<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="Stylesheet" href="style.css">
    <script src="calc.js" defer></script>
</head>
<body>
    <div class="case">
        <div class="screen">
            <h1 id="input">0</h1>
        </div>

        <div class="btns">
            
            <div class="nbtns">
                <button class="nums">7</button>
                <button class="nums">8</button>
                <button class="nums">9</button>
                <button class="nums">4</button>
                <button class="nums">5</button>
                <button class="nums">6</button>
                <button class="nums">1</button>
                <button class="nums">2</button>
                <button class="nums">3</button>
                <button class="nums">0</button>
                <button id="equalBtn">=</button>
            </div>

            
            

            <div class="case2">
                <div class="ebtns">
                    <button>+</button>
                    <button>-</button>
                    <button>*</button>
                    <button>/</button>
                </div>

                    <div class="mscBtns">
                    <button id="backBtn">BACK</button>
                    <button id="clearBtn">CLEAR</button>
                </div>
            </div>
            

            
            

        </div>

    </div>
    

    
    
</body>
</html>
