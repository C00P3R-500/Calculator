<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="Stylesheet" href="style.css">
    <script src="calc.js" defer></script>
</head>
<body>
    <div class="case">
        <div class="screen">
            <h1 id="input">0</h1>
        </div>

        <div class="btns">
            
            <div class="nbtns">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>0</button>
                <button id="equalBtn">=</button>
            </div>
            

            
            <div class="ebtns">
                <button>+</button>
                <button>-</button>
                <button>x</button>
                <button>/</button>
                <button id="undoBtn">UNDO</button>
                <button id="clearBtn">CLEAR</button>
            </div>
            

        </div>

    </div>
    

    
    
</body>
</html>
